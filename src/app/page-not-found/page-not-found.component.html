<ion-content class="bg-slate-50">
  <div class="min-h-full flex flex-col items-center justify-center p-6 text-center font-sans">
    
    <div class="relative w-full max-w-xs mx-auto mb-8 flex flex-col items-center justify-center">
      <div class="absolute w-44 h-44 rounded-full bg-blue-600/5 blur-3xl -z-10"></div>
      
      <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-blue-500 to-blue-600 shadow-lg shadow-blue-500/20 flex items-center justify-center text-white mb-6 transform rotate-6 active:rotate-0 transition-transform duration-300">
        <ion-icon name="alert-circle-outline" class="text-4xl"></ion-icon>
      </div>

      <h1 class="text-7xl font-extrabold tracking-tight text-slate-800 m-0">404</h1>
      <p class="text-xs font-bold uppercase tracking-widest text-blue-600 mt-2 bg-blue-50 px-3 py-1 rounded-full">
        Page Missing
      </p>
    </div>

    <div class="max-w-sm mx-auto space-y-2.5 mb-10">
      <h2 class="text-xl font-bold text-slate-800 tracking-tight m-0">
        Lost in the Market?
      </h2>
      <p class="text-sm text-slate-400 font-normal leading-relaxed px-4">
        The link you followed might be broken, or the page was relocated. Let’s get you back to tracking your purchases.
      </p>
    </div>

    <div class="w-full max-w-xs space-y-3">
      <button (click)="goToCatalog()" class="w-full py-3.5 px-6 rounded-xl bg-blue-600 hover:bg-blue-700 active:scale-98 text-white font-bold text-sm tracking-wide shadow-md shadow-blue-600/10 transition-all flex items-center justify-center space-x-2">
        <ion-icon name="bag-handle-outline" class="text-lg"></ion-icon>
        <span>Continue Shopping</span>
      </button>

      <button (click)="goBack()" class="w-full py-3.5 px-6 rounded-xl bg-white border border-slate-200 active:bg-slate-50 active:scale-98 text-slate-700 font-semibold text-sm tracking-wide transition-all flex items-center justify-center space-x-2">
        <ion-icon name="arrow-back-outline" class="text-lg text-slate-400"></ion-icon>
        <span>Go Back</span>
      </button>
    </div>

  </div>
</ion-content>
