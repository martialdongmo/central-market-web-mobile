<ion-app>
  <ion-router-outlet id="main-content"></ion-router-outlet>

  <ion-tab-bar slot="bottom">
    <ion-tab-button routerLink="/catalog" routerLinkActive="tab-selected">
      <ion-icon name="storefront-outline"></ion-icon>
      <ion-label>Catalogue</ion-label>
    </ion-tab-button>
    <ion-tab-button routerLink="/nearby" routerLinkActive="tab-selected">
      <ion-icon name="location-outline"></ion-icon>
      <ion-label>Proximité</ion-label>
    </ion-tab-button>
    <ion-tab-button routerLink="/promotions" routerLinkActive="tab-selected">
      <ion-icon name="flame-outline"></ion-icon>
      <ion-label>Promos</ion-label>
    </ion-tab-button>
    <ion-tab-button routerLink="/cart" routerLinkActive="tab-selected">
      <ion-icon name="cart-outline"></ion-icon>
      <ion-label>Panier</ion-label>
    </ion-tab-button>
    <ion-tab-button routerLink="/profile" routerLinkActive="tab-selected">
      <ion-icon name="person-circle-outline"></ion-icon>
      <ion-label>Profil</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-app>
