<!-- Barre de progression supérieure lors de l'envoi de la requête -->
@if (isLoading) {
  <ion-progress-bar type="indeterminate" class="absolute top-0 left-0 z-50 custom-progress-bar"></ion-progress-bar>
}

<ion-content class="ion-padding bg-slate-50">
  <!-- Bouton Retour Professionnel hors de la carte (Haut Gauche) -->
  <div class="max-w-md mx-auto w-full pt-2 pl-1">
    <ion-button 
      fill="clear" 
      routerLink="/catalog" 
      [disabled]="isLoading" 
      class="text-slate-500 hover:text-slate-800 text-xs font-semibold normal-case tracking-tight m-0 p-0 --padding-start-0">
      <ion-icon name="arrow-back-outline" slot="start" class="text-sm mr-1"></ion-icon>
      Retour au tableau de bord
    </ion-button>
  </div>

  <div class="min-h-[80vh] flex flex-col items-center justify-center p-4 font-sans">
    
    <!-- Image/Logo déplacée au-dessus de la carte avec une taille et un style professionnels -->
    <div class="flex flex-col items-center justify-center mb-6 pointer-events-none select-none">
      <div class="p-3.5 bg-white border border-slate-200/80 shadow-sm rounded-2xl flex items-center justify-center h-16 w-16 mb-2">
        <img 
          src="/assets/central-market-logo.png" 
          alt="Logo GroupinG" 
          class="h-10 w-10 object-contain" 
          (error)="$any($event).target.style.display = 'none'" />
      </div>
      <div class="flex items-center gap-1.5">
        <span class="text-slate-900 font-black tracking-wider text-xl">GroupinG<span class="text-blue-600">.</span></span>
        <span class="text-[9px] font-bold uppercase tracking-widest bg-blue-50 text-blue-600 border border-blue-100 px-2 py-0.5 rounded-md">
          Logistics
        </span>
      </div>
    </div>
    
    <!-- Carte principale au style "Protected & Secure" -->
    <ion-card class="w-full max-w-md bg-white rounded-2xl border border-slate-200/80 shadow-xl m-0 overflow-hidden relative">
      
      <!-- Ligne subtile de sécurité supérieure -->
      <div class="h-1.5 w-full bg-blue-600"></div>

      <ion-card-content class="p-6">
        
        <!-- Section Illustration & Titres (Aspect Certifié / Protégé) -->
        <div class="text-center mb-6">
          <div class="inline-flex p-3 bg-slate-50 text-slate-700 rounded-2xl mb-3 border border-slate-200 relative">
            <ion-icon name="shield-checkmark-outline" class="text-2xl text-blue-600"></ion-icon>
            <!-- Badge QR miniature pour l'indicateur visuel de scan -->
            <div class="absolute -bottom-1 -right-1 bg-white border border-slate-200 rounded-md p-0.5 shadow-sm flex items-center justify-center">
              <ion-icon name="qr-code-outline" class="text-xs text-slate-500"></ion-icon>
            </div>
          </div>
          <h2 class="text-lg font-bold text-slate-900 tracking-tight">Validation de Commande</h2>
          <p class="text-xs font-medium text-slate-500 mt-1">Espace sécurisé de vérification des jetons de livraison.</p>
        </div>

        <!-- Section Formulaire -->
        <div class="space-y-5">
          <div class="border border-slate-200 rounded-xl overflow-hidden bg-white px-3 py-1.5 focus-within:ring-2 focus-within:ring-blue-500/20 focus-within:border-blue-600 transition-all">
            <label class="text-[10px] font-bold text-blue-600 uppercase tracking-wider block mb-0.5">Code de Validation</label>
            <ion-input 
              [(ngModel)]="orderCode" 
              type="text" 
              placeholder="Ex: VAL-..." 
              [disabled]="isLoading"
              class="font-mono font-semibold text-slate-800 text-sm --padding-start-0">
            </ion-input>
          </div>

          <!-- Bouton Bleu avec Spinner Intégré -->
          <ion-button 
            expand="block" 
            [disabled]="isLoading || !orderCode.trim()"
            (click)="validerCommande()"
            class="h-12 font-semibold text-sm tracking-wide custom-blue-button m-0">
            
            @if (isLoading) {
              <div class="flex items-center justify-center gap-2">
                <ion-spinner name="crescent" class="w-5 h-5 custom-spinner"></ion-spinner>
                <span class="text-white">Validation en cours...</span>
              </div>
            } @else {
              <span class="text-white">Valider la Commande</span>
            }
            
          </ion-button>
        </div>

        <!-- Alertes et Notifications Dynamiques -->
        @if (message) {
          <div class="mt-5 p-4 rounded-xl text-xs font-semibold border flex items-start gap-2.5"
               [ngClass]="isError ? 'bg-rose-50 text-rose-700 border-rose-200' : 'bg-blue-50 text-blue-700 border-blue-200'">
            <ion-icon [name]="isError ? 'alert-circle-outline' : 'checkmark-circle-outline'" class="text-lg mt-0.5 flex-shrink-0"></ion-icon>
            <div class="leading-relaxed">{{ message }}</div>
          </div>
        }

        <!-- Mention de sécurité en bas de formulaire -->
        <div class="mt-6 flex items-center justify-center gap-1.5 text-[10px] font-medium text-slate-400">
          <ion-icon name="lock-closed-outline" class="text-xs"></ion-icon>
          <span>Session d'administration chiffrée</span>
        </div>

      </ion-card-content>
    </ion-card>
    
  </div>
</ion-content>
