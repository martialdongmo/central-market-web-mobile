<div class="auth-header">
  <button class="auth-back-btn" (click)="navCtrl.back()">
    <ion-icon name="arrow-back-outline"></ion-icon>
  </button>
</div>

<ion-content>
  <div class="auth-body">
    <h1 class="auth-title">Ravi de vous<br>revoir.</h1>
    <p class="auth-sub">Connectez-vous pour continuer votre commande.</p>

    <div class="auth-field">
      <label class="auth-label">Email</label>
      <div class="auth-input-wrap">
        <div class="auth-input-icon"><ion-icon name="mail-outline"></ion-icon></div>
        <input type="email" placeholder="votre@email.com" [(ngModel)]="email">
      </div>
    </div>

    <div class="auth-field">
      <label class="auth-label">Mot de passe</label>
      <div class="auth-input-wrap">
        <div class="auth-input-icon"><ion-icon name="lock-closed-outline"></ion-icon></div>
        <input type="password" placeholder="••••••••" [(ngModel)]="password">
      </div>
      <div class="forgot-link"><button type="button">Mot de passe oublié ?</button></div>
    </div>

    <!-- Error message -->
    <div *ngIf="errorMsg" class="auth-error">
      <ion-icon name="alert-circle-outline"></ion-icon>
      {{ errorMsg }}
    </div>

    <button class="auth-submit-btn" (click)="login()" [class.loading]="isLoading">
      <span *ngIf="!isLoading">SE CONNECTER</span>
      <div *ngIf="isLoading" class="btn-spinner"></div>
    </button>

    <div class="auth-divider"><span>ou</span></div>

    <!-- Demo credentials hint -->
    <div class="demo-hint" (click)="fillDemo()">
      <ion-icon name="flash-outline"></ion-icon>
      <span>Connexion rapide (démo)</span>
    </div>

    <div class="auth-switch">
      <p>Vous n'avez pas de compte ?</p>
      <button routerLink="/register">CRÉER UN COMPTE</button>
    </div>
  </div>
</ion-content>
