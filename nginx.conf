user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ------------------------------------------------------------
    # HTTP (Port 80) → Global Redirect to HTTPS
    # ------------------------------------------------------------
    server {
        listen 80;
        server_name kapexpert.cloud;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ------------------------------------------------------------
    # HTTPS (Port 443) → Angular Frontend
    # ------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name kapexpert.cloud;

        ssl_certificate     /etc/letsencrypt/live/kapexpert.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kapexpert.cloud/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
    }

    # ------------------------------------------------------------
    # HTTPS (Port 9009) → Native Spring Cloud Gateway Proxy
    # ------------------------------------------------------------
    server {
        listen 9009 ssl;
        server_name kapexpert.cloud;

        ssl_certificate     /etc/letsencrypt/live/kapexpert.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kapexpert.cloud/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            # Route traffic directly to your API Gateway container service name
            proxy_pass https://api-gateway:9009;

            # 1. Essential Forwarding Headers for Spring's Framework Strategy
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port 9009;

            # 2. Force Cookie Headers to Pass Unchanged
            proxy_pass_header Set-Cookie;

            # 3. Rewrite Internal Docker Cookie Domains to your Public Domain
            proxy_cookie_domain auth-service kapexpert.cloud;
            proxy_cookie_domain api-gateway kapexpert.cloud;
            proxy_cookie_domain localhost kapexpert.cloud;
            proxy_cookie_path / /;

            # 4. Expand Buffers to prevent choking on massive OAuth2 Redirect Headers
            proxy_buffer_size          128k;
            proxy_buffers            4 256k;
            proxy_busy_buffers_size    256k;

            # WebSocket Support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts
            proxy_connect_timeout 90;
            proxy_send_timeout 90;
            proxy_read_timeout 90;
        }
    }
}