# Full configuration file for central-market-mobile

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # HTTP Server Configuration - Redirect to HTTPS on port 3000
    server {
        listen 80;
        listen [::]:80;
        server_name kapexpert.cloud;

        return 301 https://$host:3000$request_uri;
    }

    # HTTPS Server Configuration
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name kapexpert.cloud;

        # SSL Certificates mapped via Docker volumes
        ssl_certificate /etc/letsencrypt/live/kapexpert.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kapexpert.cloud/privkey.pem;

        # Modern Security-focused TLS settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Angular build distribution destination directory
        root /usr/share/nginx/html;
        index index.html;

        # Fallback config to handle Angular Client-Side SPA routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache control for production assets
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
            expires 6m;
            access_log off;
            add_header Cache-Control "public, max-age=15778463";
        }

        # Essential Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }
}