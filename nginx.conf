user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ----------------------------
    # HTTP (Port 80) → Redirect to HTTPS
    # ----------------------------
    server {
        listen 80;
        server_name kapexpert.cloud;
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ----------------------------
    # HTTPS (Port 443) → Mobile Angular App
    # ----------------------------
    server {
        listen 443 ssl;
        server_name kapexpert.cloud;

        ssl_certificate     /etc/letsencrypt/live/kapexpert.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kapexpert.cloud/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
    }

    # ----------------------------
    # HTTPS (Port 9009) → Split routing
    # /api/** → Gateway | everything else → auth-service
    # ----------------------------
    server {
        listen 9009 ssl;
        server_name kapexpert.cloud;

        ssl_certificate     /etc/letsencrypt/live/kapexpert.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kapexpert.cloud/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # ── API calls → Gateway ──
        location /api/ {
            proxy_pass https://api-gateway:9009;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port  9009;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 90;
            proxy_send_timeout    90;
            proxy_read_timeout    90;

            proxy_ssl_verify off;

            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;

            add_header Access-Control-Allow-Origin      "https://kapexpert.cloud:3000" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, Refresh-Token" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin      "https://kapexpert.cloud:3000" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
                add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, Refresh-Token" always;
                return 204;
            }
        }

        # ── Auth / OAuth2 flows → auth-service ──
        location / {
            proxy_pass http://auth-service:9000;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port  9009;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 90;
            proxy_send_timeout    90;
            proxy_read_timeout    90;
        }
    }
}