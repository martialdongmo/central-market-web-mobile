events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Optimize buffer sizes to prevent 502 Bad Gateway errors with large OAuth2 JWT tokens
    proxy_buffer_size          128k;
    proxy_buffers              4 256k;
    proxy_busy_buffers_size    256k;

    # Dynamic log format to track actual client IPs instead of internal container IPs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    sendfile        on;
    keepalive_timeout  65;

    # =========================================================================
    # FRONTEND EDGE ROUTING ENGINE (Port 443 with SSL)
    # =========================================================================
    server {
        listen 443 ssl;
        server_name kapexpert.cloud www.kapexpert.cloud;

        # Direct volume paths mapped in your docker-compose.yml
        ssl_certificate     /etc/letsencrypt/live/kapexpert.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kapexpert.cloud/privkey.pem;

        # Secure Production SSL Parameters
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Where your Ionic compiled files live inside the container
        root /usr/share/nginx/html;
        index index.html index.htm;

        # Crucial for Ionic/Angular Single Page Application (SPA) routing
        # Redirects deep links (like /tabs/home) back to index.html instead of 404ing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # =====================================================================
        # BACKEND PASSTHROUGH TO API GATEWAY
        # Handles any requests your frontend sends directly to /api/ or /oauth2/
        # =====================================================================
        location ~ ^/(api|oauth2|login|connect|userinfo|\.well-known)/ {
            # Route straight into your Spring Cloud Gateway container over its SSL layer
            proxy_pass https://api-gateway:9009;

            # THE FIX: Tell Spring Cloud Gateway exactly who the public client is
            proxy_set_header Host $host:9009;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port 9009;

            # WebSocket Support for real-time gateway streams
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Max size for image/document uploads via microservices
            client_max_body_size 50M;
        }
    }

    # Optional: Automatically drop non-encrypted port 80 traffic into HTTPS
    server {
        listen 80;
        server_name kapexpert.cloud www.kapexpert.cloud;
        return 301 https://$host$request_uri;
    }
}