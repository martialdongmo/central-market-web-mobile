user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ----------------------------
    # HTTP → Redirect to HTTPS
    # ----------------------------
    server {
        listen 80;
        server_name kapexpert.cloud;
        return 301 https://$host$request_uri;
    }

    # ----------------------------
    # HTTPS (Port 3000) → Frontend Mobile Angular App
    # ----------------------------
    server {
        listen 3000 ssl;
        server_name kapexpert.cloud;

        ssl_certificate     /etc/letsencrypt/live/kapexpert.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kapexpert.cloud/privkey.pem;

        root /usr/share/nginx/html-mobile;
        index index.html;

        # Angular routes
        location / {
            try_files $uri $uri/ /index.html;
        }

        # API calls → Gateway (via 9010 → 9009 interne)
        location /api/ {
            proxy_pass https://api-gateway:9009;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_ssl_verify off;

            # CORS headers pour le frontend mobile
            add_header Access-Control-Allow-Origin      "https://kapexpert.cloud:3000" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, DELETE, OPTIONS, PATCH" always;
            add_header Access-Control-Allow-Headers     "Authorization, Content-Type, Accept, Refresh-Token" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }
    }

    # ----------------------------
    # HTTPS (Port 9010) → API Gateway direct access
    # ----------------------------
    server {
        listen 9010 ssl;
        server_name kapexpert.cloud;

        ssl_certificate     /etc/letsencrypt/live/kapexpert.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kapexpert.cloud/privkey.pem;

        location / {
            proxy_pass https://api-gateway:9009;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
