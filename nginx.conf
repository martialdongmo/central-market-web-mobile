user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ----------------------------
    # HTTP (Port 80) ? Global Redirect to HTTPS
    # ----------------------------
    server {
        listen 80;
        server_name kapexpert.cloud;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ----------------------------
    # HTTPS (Port 443) ? Angular Frontend
    # ----------------------------
    server {
        listen 443 ssl;
        server_name kapexpert.cloud;

        ssl_certificate     /etc/letsencrypt/live/kapexpert.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kapexpert.cloud/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
    }

    # ----------------------------
    # HTTPS (Port 9009) ? Auth / Gateway Service
    # ----------------------------
    server {
        listen 9009 ssl;
        server_name kapexpert.cloud;

        ssl_certificate     /etc/letsencrypt/live/kapexpert.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kapexpert.cloud/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location / {
            # Point this to your internal docker service name (e.g., gateway-service or auth-service)
            proxy_pass http://auth-service:9000;

            # CRITICAL: These headers allow Spring Security to trust the proxy
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;  # Essential for "secure: true" cookies
            proxy_set_header X-Forwarded-Port 9009;     # Helps Spring generate correct redirect URLs

            # WebSocket support (Optional, useful for some microservice features)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Timeouts for Auth flows
            proxy_connect_timeout 90;
            proxy_send_timeout 90;
            proxy_read_timeout 90;
        }
    }
}
