user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 4096;

    # Production Security
    server_tokens off;

    # Global SSL Settings Optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ===================================================================
    # 1. SHOP FRONTEND APP (Port 3001)
    # Serves traffic for: https://kapexpert.cloud:3001/callback
    # ===================================================================
    server {
        listen 3001 ssl;
        server_name kapexpert.cloud www.kapexpert.cloud;

        ssl_certificate /etc/letsencrypt/live/kapexpert.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kapexpert.cloud/privkey.pem;

        location / {
            # Routes to your shop frontend docker service
            proxy_pass http://central-market-shop:443;
            
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # SPA routing fallback & WebSockets
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }
    }

    # ===================================================================
    # 2. WEB MOBILE FRONTEND APP (Port 3000)
    # Serves traffic for your second frontend application
    # ===================================================================
    server {
        listen 3000 ssl;
        server_name kapexpert.cloud www.kapexpert.cloud;

        ssl_certificate /etc/letsencrypt/live/kapexpert.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kapexpert.cloud/privkey.pem;

        location / {
            # Routes to your web-mobile frontend docker service
            proxy_pass http://central-market-web-mobile:443;
            
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
        }
    }

    # ===================================================================
    # 3. API GATEWAY ROUTING (Port 9009)
    # ===================================================================
    server {
        listen 9009 ssl;
        server_name kapexpert.cloud www.kapexpert.cloud;

        ssl_certificate /etc/letsencrypt/live/kapexpert.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kapexpert.cloud/privkey.pem;

        location / {
            proxy_pass https://api-gateway:9009;
            
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port 9009;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            proxy_connect_timeout 90s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
        }
    }

    # ===================================================================
    # 4. GLOBAL HTTP TO HTTPS REDIRECT (Port 80)
    # ===================================================================
    server {
        listen 80;
        server_name kapexpert.cloud www.kapexpert.cloud;
        
        location / {
            return 301 https://$host$request_uri;
        }
    }
}