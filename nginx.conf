server {
    listen 9009 ssl;
    server_name kapexpert.cloud;

    ssl_certificate     /etc/letsencrypt/live/kapexpert.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kapexpert.cloud/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # API calls → Gateway
    location /api/ {
        proxy_pass https://api-gateway:9009;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth flows → auth-service
    location / {
        proxy_pass http://auth-service:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploads → Gateway
    location /uploads/ {
        proxy_pass https://api-gateway:9009;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
