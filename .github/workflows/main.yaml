name: Central Market Web Mobile CI/CD

on:
  push:
    branches:
      - deployment
      - sidof-dev

  pull_request:
    branches:
      - main
      - deployment
      - test

jobs:
  build-and-push:
    name: Build and Deploy Web App
    runs-on: ubuntu-latest

    steps:
      # Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build application
      - name: Build the app
        run: npm run build --if-present

      # Docker login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Build & Push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/central-market-web:latest
            ${{ secrets.DOCKER_HUB_USERNAME }}/central-market-web:${{ secrets.IMAGE_TAG }}
  
      # Deploy to server using SSH
  deploy-to-vps:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/deployment'
    steps:
      - name: SSH & Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd ~/central-market-app

            echo "${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}" | docker login \
              -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin

            docker compose pull central-market-web
            docker compose up -d --remove-orphans central-market-web

            docker image prune -f