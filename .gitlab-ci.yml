# ============================================================
# GitLab CI — Android APK Build via Fastlane
# ============================================================
#
# This pipeline:
#   1. Installs Node.js 22, npm deps, and syncs Capacitor
#   2. Installs Android SDK (platform 36, build-tools 36.0.0)
#   3. Builds Android debug APK via Gradle (assembleDebug)
#      For release builds, use Fastlane with signing config
#
# Prerequisites (configure in GitLab > Settings > CI/CD > Variables):
#   ANDROID_SDK_ROOT   → /opt/android-sdk
#   FASTLANE_USER      → your Apple ID email
#   FASTLANE_PASSWORD  → your Apple ID app-specific password
#   MATCH_PASSWORD     → your Match/Git Repo encryption password
#   MATCH_GIT_BASIC_AUTHORIZATION → base64(user:token) for Match repo
# ============================================================

stages:
  - build

variables:
  GIT_DEPTH: 0
  FASTLANE_DISABLE_ANIMATION: "1"
  FASTLANE_SKIP_UPDATE_CHECK: "1"

# ----------------------------------------
# Template: Android SDK installation
# ----------------------------------------
.android-sdk-template: &android-sdk-template
  before_script:
    # Install OpenJDK 21 (required for Java 21 compatibility)
    - apt-get update && apt-get install -y openjdk-21-jdk-headless unzip curl wget
    - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
    - export PATH=$JAVA_HOME/bin:$PATH
    - java -version

    # Install Android SDK command-line tools
    - |
      if [ ! -d "/opt/android-sdk/cmdline-tools/latest" ]; then
        mkdir -p /opt/android-sdk/cmdline-tools
        cd /tmp
        wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mv cmdline-tools /opt/android-sdk/cmdline-tools/latest
        rm cmdline-tools.zip
      fi
    - export ANDROID_HOME=/opt/android-sdk
    - export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH

    # Accept licenses and install required SDK components
    # SDK 36 matches compileSdkVersion in variables.gradle
    - yes | sdkmanager --licenses > /dev/null 2>&1 || true
    - sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      --sdk_root=$ANDROID_HOME

    # Create local.properties so Gradle finds the SDK (no gitignore conflict)
    - echo "sdk.dir=$ANDROID_HOME" > android/local.properties

    - echo "✅ Android SDK ready: $(sdkmanager --list_installed | head -5)"

# ----------------------------------------
# Job: Build Android APK with Fastlane
# ----------------------------------------
build:android:
  stage: build
  image: ubuntu:24.04
  tags:
    - docker
  <<: *android-sdk-template

  before_script:
    # Install OpenJDK 21 (required for Java 21 compatibility)
    - apt-get update && apt-get install -y openjdk-21-jdk-headless unzip curl wget git ruby ruby-dev build-essential
    - export JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64
    - export PATH=$JAVA_HOME/bin:$PATH
    - java -version

    # Install Android SDK command-line tools
    - |
      if [ ! -d "/opt/android-sdk/cmdline-tools/latest" ]; then
        mkdir -p /opt/android-sdk/cmdline-tools
        cd /tmp
        wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O cmdline-tools.zip
        unzip -q cmdline-tools.zip
        mv cmdline-tools /opt/android-sdk/cmdline-tools/latest
        rm cmdline-tools.zip
      fi
    - export ANDROID_HOME=/opt/android-sdk
    - export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
    - yes | sdkmanager --licenses > /dev/null 2>&1 || true
    - sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" --sdk_root=$ANDROID_HOME
    - echo "sdk.dir=$ANDROID_HOME" > android/local.properties

    # Install Node.js 22
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash - && apt-get install -y nodejs

    # npm ci and Capacitor sync
    - npm ci
    - npx cap sync android

    # Install Fastlane
    - gem install fastlane --no-document

  script:
    - echo "Building Android APK..."
    - |
      cd android
      ./gradlew assembleDebug \
        --warning-mode all \
        --no-daemon \
        --stacktrace 2>&1 | tee ../build.log
    - |
      if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
        echo "✅ APK built successfully:"
        ls -lh app/build/outputs/apk/debug/app-debug.apk
      else
        echo "❌ APK not found. Check build.log above for errors."
        cat ../build.log | grep -E "(FAILURE|error:|Error:|What went wrong|SDK|exception)" | head -20
        exit 1
      fi

  artifacts:
    when: always
    paths:
      - build.log
      - android/app/build/outputs/apk/debug/app-debug.apk
    expire_in: 1 week

  after_script:
    - echo "clean-up"
